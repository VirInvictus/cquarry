<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="cquarry logo">
  <rect width="128" height="128" rx="24" fill="#181616"/>
  
  <!-- Database cylinder (Calibre DB) -->
  <path d="M34 76 v24 a30 10 0 0 0 60 0 v-24" fill="none" stroke="#c5c9c5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="64" cy="76" rx="30" ry="10" fill="#181616" stroke="#c5c9c5" stroke-width="5"/>
  <path d="M34 88 a30 10 0 0 0 60 0" fill="none" stroke="#c5c9c5" stroke-width="4" stroke-linecap="round"/>

  <!-- Search Grammar AST branching up from the database -->
  <g stroke="#c5c9c5" stroke-width="4" stroke-linecap="round">
    <line x1="64" y1="76" x2="64" y2="46"/>
    <line x1="64" y1="46" x2="38" y2="28"/>
    <line x1="64" y1="46" x2="90" y2="28"/>
  </g>

  <!-- DB center anchor -->
  <circle cx="64" cy="76" r="3" fill="#c5c9c5"/>

  <!-- AST Nodes in Kanagawa colors -->
  <circle cx="38" cy="28" r="6" fill="#181616" stroke="#c4746e" stroke-width="4"/>
  
  <!-- Magnifying glass (search grammar) -->
  <circle cx="90" cy="28" r="6" fill="#181616" stroke="#8a9a7b" stroke-width="4"/>
  <line x1="94" y1="32" x2="102" y2="40" stroke="#8a9a7b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Center junction -->
  <circle cx="64" cy="46" r="6" fill="#181616" stroke="#658594" stroke-width="4"/>
</svg>
