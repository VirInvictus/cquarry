name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

# The publish job escalates to id-token: write for OIDC; everything else
# stays read-only, and the create-release job scopes its contents: write to
# minting the Release from the tag's verbatim message.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Lint (the same gates CI runs on main)
        run: |
          pip install ruff==0.16.8
          ruff check .
          ruff format --check .

      - name: Run test suite
        run: |
          PYTHONPATH=src python -m unittest discover -s tests

  build-and-publish:
    name: Build distribution and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cquarry
    permissions:
      id-token: write # Required for OIDC authentication with PyPI

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install build
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the distribution metadata
        run: twine check --strict dist/*

      - name: Smoke-install the wheel
        run: |
          python -m venv .smoke
          .smoke/bin/pip install dist/*.whl
          .smoke/bin/python -c "import cquarry; print('smoke ok')"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  create-release:
    name: Create the GitHub Release from the tag
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # --notes-from-tag reads the tag's local git object, so this job needs
      # the clone (and --repo is rejected alongside --notes-from-tag).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Mint the Release from the tag's verbatim message
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --notes-from-tag --verify-tag
