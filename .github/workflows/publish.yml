name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

# The publish job escalates to id-token: write for OIDC; everything else
# stays read-only, and the create-release job scopes its contents: write to
# minting the Release from the tag's verbatim message.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Lint (the same gates CI runs on main)
        run: |
          pip install ruff==0.16.8
          ruff check .
          ruff format --check .

      - name: Run test suite
        run: |
          PYTHONPATH=src python -m unittest discover -s tests

  build-and-publish:
    name: Build distribution and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cquarry
    permissions:
      id-token: write # Required for OIDC authentication with PyPI

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install build
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the distribution metadata
        run: twine check --strict dist/*

      - name: Smoke-install the wheel
        run: |
          python -m venv .smoke
          .smoke/bin/pip install dist/*.whl
          .smoke/bin/python -c "import cquarry; print('smoke ok')"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  create-release:
    name: Create the GitHub Release from the tag
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The job needs a clone for the local tag-object read below (gh's
      # --notes-from-tag is NOT used: inside Actions it silently falls back
      # to the commit message -- Catagotchi issue #2, sixteen damaged
      # cquarry releases repaired 2026-11-17).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      # checkout rewrites refs/tags/vX to the resolved commit SHA even after
      # its fetch (deadbeef-cui v2.0.1 precedent), so the annotated object
      # must be re-fetched --force right before it is read.
      - name: Fetch the annotated tag object
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - name: Mint the Release from the tag's verbatim message
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # Idempotent: a tag pushed twice (followTags riding a branch push
        # plus an explicit tag push) fires two runs, and the second's create
        # would 422 "tag_name already exists" against the first's Release.
        # The tag message is immutable, so an existing Release already has
        # the verbatim body this step exists to publish.
        run: |
          if gh release view "$GITHUB_REF_NAME" --json id --jq .id; then
            echo "Release for $GITHUB_REF_NAME already exists; nothing to mint."
          else
            OT="$(git for-each-ref "refs/tags/$TAG" --format='%(objecttype)')"
            if [ "$OT" != "tag" ]; then
              echo "::error::tag $TAG is $OT, not an annotated tag; the verbatim patchnotes entry is unavailable"
              exit 1
            fi
            git for-each-ref "refs/tags/$TAG" --format='%(contents)' > /tmp/release-notes.md
            TITLE="$(head -1 /tmp/release-notes.md)"
            gh release create "$TAG" --verify-tag --notes-file /tmp/release-notes.md --title "$TITLE"
          fi
