name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install .
      - run: pip install ruff==0.16.8
      - run: ruff check .
      - run: ruff format --check .
      - run: PYTHONPATH=src python -m unittest discover -s tests

  py315:
    # The dev machine runs Fedora 45 / Python 3.15; keep the new interpreter
    # gated so a 3.15-only regression surfaces here, not on that machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pip install .
      - run: pip install pytest
      - run: PYTHONPATH=src python -m pytest tests/ -q
