[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cquarry"
version = "1.9.0"
description = "Canonical Calibre DB and Search Grammar Library"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = ["calibre", "ebooks", "sqlite", "search", "metadata"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/VirInvictus/cquarry"

[tool.ruff.lint]
ignore = ["S110", "BLE001", "RUF012", "DTZ011", "PIE810", "FURB162"]
