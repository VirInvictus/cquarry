[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cquarry"
version = "1.23.0"
description = "Canonical Calibre database layer and search grammar engine: read-only access by design, with an explicit opt-in write module for sanctioned mutations."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = ["calibre", "database", "sqlite", "search", "parser"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/VirInvictus/cquarry"
"Bug Tracker" = "https://github.com/VirInvictus/cquarry/issues"
Changelog = "https://github.com/VirInvictus/cquarry/blob/main/patchnotes.md"
Documentation = "https://github.com/VirInvictus/cquarry/blob/main/API.md"


[tool.ruff.lint]
ignore = ["S110", "BLE001", "RUF012", "DTZ011", "PIE810", "FURB162"]

[tool.pytest.ini_options]
pythonpath = ["src"]
