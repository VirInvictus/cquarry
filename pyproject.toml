[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cquarry"
version = "1.9.0"
description = "A pure Python Calibre database layer and search grammar engine."
readme = "README.md"
keywords = ["calibre", "database", "sqlite", "search", "parser"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
requires-python = ">=3.14"
license = "MIT"
